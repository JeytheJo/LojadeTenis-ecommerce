name: Keep Backend Alive

on:
  schedule:
    # roda a cada 14 minutos de segunda a sexta
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -I https://kicksco-backend.onrender.com/api/health